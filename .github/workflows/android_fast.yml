name: Android Fast CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fast_guardrails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run fast Android checks
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Lint harness docs
        shell: pwsh
        run: ./scripts/ci/docs_lint.ps1

      - name: Run smoke harness suite
        run: python harness/runners/cli.py eval --suite smoke --enforce-thresholds --report harness/reports/fast_smoke_report.json

      - name: Upload debug APK and smoke report
        uses: actions/upload-artifact@v4
        with:
          name: fast-ci-artifacts
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            harness/reports/fast_smoke_report.json
          retention-days: 5
