name: Android Nightly CI

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  nightly_full:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run nightly Android checks
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug

      - name: Run all harness suites
        run: python harness/runners/cli.py eval --suite all --report harness/reports/nightly_report.json

      - name: Render nightly markdown summary
        run: python harness/runners/cli.py report --input harness/reports/smoke_nightly_report.json --output harness/reports/nightly_summary.md

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-artifacts
          path: |
            harness/reports/smoke_nightly_report.json
            harness/reports/protocol_nightly_report.json
            harness/reports/nightly_summary.md
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
